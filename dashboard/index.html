<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NexusWatch</title>
    <meta name="description" content="Heartbeats, logs, metrics and alerts for NexusInfra and FinVault." />
    <!-- Browser chrome colour. The app follows its own theme toggle, so AppShell keeps the unscoped tag
         in step with --bg; the media-scoped pair covers the first paint before JS runs. -->
    <meta name="theme-color" content="#0b0e14" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexusWatch" />
    <script>
      // Apply the stored theme before first paint (ThemeProvider takes over once React mounts),
      // so a reload or the installed app never flashes dark before switching to light.
      (function () {
        try {
          var p = localStorage.getItem('nexuswatch.theme') || 'dark';
          var dark = p === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : p !== 'light';
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]:not([media])').content = dark ? '#0b0e14' : '#f6f7f9';
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
